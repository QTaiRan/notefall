name: Feature Request
description: Suggest a new feature or improvement for notefall.
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea! The more we understand the problem you're trying to solve, the better the eventual solution will be.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve, or what use case does it enable?
      placeholder: e.g. While editing long pieces I can't easily jump to a specific bar — scrolling is too slow.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you imagine it working? Behaviour, UI, keyboard shortcut, etc.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you ruled them out.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Auto-filled from the app.
      render: text
    validations:
      required: false
